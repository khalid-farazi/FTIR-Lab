<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated Halal FTIR logo</title>
  <desc id="desc">A Bangladeshi chorki spins, slows, and transforms into the H of Halal FTIR.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06132F" flood-opacity=".13"/>
    </filter>
  </defs>

  <g id="mark" filter="url(#softShadow)">
    <g id="blades">
      <animateTransform attributeName="transform" type="rotate"
        values="0 230 160;1080 230 160;1380 230 160;1440 230 160"
        keyTimes="0;.42;.78;1" dur="3s" calcMode="spline"
        keySplines=".12,.72,.15,1;.18,.72,.22,1;.3,.7,.35,1" fill="freeze"/>

      <path fill="#11A579" d="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z">
        <animate attributeName="d" begin="3s" dur="1.15s" fill="freeze"
          values="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z;M170 80 C170 80 195 80 195 80 C195 80 195 160 195 160 C195 160 170 160 170 160 Z"/>
        <animate attributeName="fill" begin="3s" dur="1.15s" fill="freeze" from="#11A579" to="#06132F"/>
      </path>
      <path fill="#3BA7D8" transform="rotate(90 230 160)" d="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z">
        <animateTransform attributeName="transform" type="rotate" begin="3s" dur="1.15s" fill="freeze" from="90 230 160" to="0 230 160"/>
        <animate attributeName="d" begin="3s" dur="1.15s" fill="freeze"
          values="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z;M265 80 C265 80 290 80 290 80 C290 80 290 160 290 160 C290 160 265 160 265 160 Z"/>
        <animate attributeName="fill" begin="3s" dur="1.15s" fill="freeze" from="#3BA7D8" to="#06132F"/>
      </path>
      <path fill="#8A1538" transform="rotate(180 230 160)" d="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z">
        <animateTransform attributeName="transform" type="rotate" begin="3s" dur="1.15s" fill="freeze" from="180 230 160" to="0 230 160"/>
        <animate attributeName="d" begin="3s" dur="1.15s" fill="freeze"
          values="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z;M170 160 C170 160 195 160 195 160 C195 160 195 240 195 240 C195 240 170 240 170 240 Z"/>
        <animate attributeName="fill" begin="3s" dur="1.15s" fill="freeze" from="#8A1538" to="#06132F"/>
      </path>
      <path fill="#E9A23B" transform="rotate(270 230 160)" d="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z">
        <animateTransform attributeName="transform" type="rotate" begin="3s" dur="1.15s" fill="freeze" from="270 230 160" to="0 230 160"/>
        <animate attributeName="d" begin="3s" dur="1.15s" fill="freeze"
          values="M230 160 C202 137 196 91 230 42 C251 80 263 126 230 160 Z;M265 160 C265 160 290 160 290 160 C290 160 290 240 290 240 C290 240 265 240 265 240 Z"/>
        <animate attributeName="fill" begin="3s" dur="1.15s" fill="freeze" from="#E9A23B" to="#06132F"/>
      </path>
    </g>

    <rect x="219" y="149" width="22" height="22" rx="11" fill="#8A1538">
      <animate attributeName="x" begin="3s" dur="1.15s" fill="freeze" from="219" to="195"/>
      <animate attributeName="y" begin="3s" dur="1.15s" fill="freeze" from="149" to="148"/>
      <animate attributeName="width" begin="3s" dur="1.15s" fill="freeze" from="22" to="70"/>
      <animate attributeName="height" begin="3s" dur="1.15s" fill="freeze" from="22" to="24"/>
      <animate attributeName="rx" begin="3s" dur="1.15s" fill="freeze" from="11" to="5"/>
    </rect>
  </g>

  <g opacity="0" transform="translate(24 0)">
    <animate attributeName="opacity" begin="3.55s" dur=".7s" fill="freeze" from="0" to="1"/>
    <animateTransform attributeName="transform" type="translate" begin="3.55s" dur=".7s" fill="freeze" from="24 0" to="0 0"/>
    <text x="310" y="220" fill="#06132F" font-family="Georgia, Cambria, serif" font-size="78">alal</text>
    <text x="475" y="220" fill="#06132F" font-family="Georgia, Cambria, serif" font-size="112" font-weight="700">FTIR</text>
    <rect x="478" y="237" width="286" height="5" rx="2.5" fill="#8A1538"/>
  </g>
</svg>
